<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 458" width="640" height="458" role="img" aria-labelledby="t d"><title id="t">The eight Annex III areas</title><desc id="d">Biometrics, critical infrastructure, education, employment, essential services, law enforcement, migration and border control, justice and democratic processes.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs><rect x="0.75" y="0.75" width="638.5" height="456.5" rx="18" fill="#ffffff" stroke="#e6e9f2" stroke-width="1.5"/><text x="24" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#4f46e5" text-anchor="start">The eight Annex III areas</text><rect x="24" y="60" width="290" height="84" rx="14" fill="#f6f7fb" stroke="#e6e9f2" stroke-width="1.5"/><circle cx="60" cy="102" r="20" fill="#4f46e5"/><text x="60" y="109" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="92" y="109" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="600" fill="#0b1220" text-anchor="start">Biometrics</text><rect x="326" y="60" width="290" height="84" rx="14" fill="#f6f7fb" stroke="#e6e9f2" stroke-width="1.5"/><circle cx="362" cy="102" r="20" fill="#4f46e5"/><text x="362" y="109" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="394" y="98" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="600" fill="#0b1220" text-anchor="start">Critical</text><text x="394" y="121" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="600" fill="#0b1220" text