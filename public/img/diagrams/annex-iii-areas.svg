-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="600" fill="#0b1220" text-anchor="start">services and benefits</text><rect x="326" y="256" width="290" height="84" rx="14" fill="#f6f7fb" stroke="#e6e9f2" stroke-width="1.5"/><circle cx="362" cy="298" r="20" fill="#4f46e5"/><text x="362" y="305" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><text x="394" y="294" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="600" fill="#0b1220" text-anchor="start">Law</text><text x="394" y="317" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="600" fill="#0b1220" text-anchor="start">enforcement</text><rect x="24" y="354" width="290" height="84" rx="14" fill="#f6f7fb" stroke="#e6e9f2" stroke-width="1.5"/><circle cx="60" cy="396" r="20" fill="#4f46e5"/><text x="60" y="403" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">7</text><text x="92" y="392" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="600" fill="#0b1220" text-anchor="start">Migration, asylum</text><text x="92" y="415" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="600" fill="#0b1220" text-anchor="start">and border control</text><rect x="326" y="354" width="290" height="84" rx="14" fill="#f6f7fb" stroke="#e6e9f2" stroke-width="1.5"/><circle cx="362" cy="396" r="20" fill="#4f46e5"/><text x="362" y="403" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">8</text><text x="394" y="392" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-