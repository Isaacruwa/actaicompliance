<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 418" width="640" height="418" role="img" aria-labelledby="t d"><title id="t">EU AI Act risk tiers</title><desc id="d">Four tiers: unacceptable risk is banned, high risk has strict duties, transparency risk requires disclosure, minimal risk has no specific duties.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs><rect x="0.75" y="0.75" width="638.5" height="416.5" rx="18" fill="#ffffff" stroke="#e6e9f2" stroke-width="1.5"/><text x="24" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#4f46e5" text-anchor="start">EU AI Act risk tiers</text><rect x="130.0" y="58" width="380" height="76" rx="12" fill="#ef4444"/><text x="320" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Unacceptable risk</text><text x="320" y="117" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="500" fill="#ffffff" text-anchor="middle">Banned since 2 Feb 2025</text><rect x="85.0" y="146" width="470" height="76" rx="12" fill="#f59e0b"/><text x="320" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">High risk</text><text x="320" y="205" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="500" fill="#1f2937" text-anchor="middle">Strict duties (Annex III from 2 Dec 2027)</text><rect x="40.0" y="234" width="560" height="76" rx="12" fill="#3b82f6"/><text x="320" y="268" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Transparency risk</text><text x="320" y="293" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="500" fill="#ffffff" text-anchor="middle">Disclose AI use (Article 50)</text><rect x="10.0" y="322" width="620" height="76" rx="12" fill="#10b981"/><text x="320" y="356" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Minimal risk</text><text x="320" y="381" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="500" fill="#ffffff" text-anchor="middle">No specific AI Act duties</text></svg>