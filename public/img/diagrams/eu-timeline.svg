<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500" role="img" aria-labelledby="t d"><title id="t">EU AI Act key dates</title><desc id="d">Timeline from entry into force on 1 August 2024 to Annex I high-risk rules on 2 August 2028.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs><rect x="0.75" y="0.75" width="638.5" height="498.5" rx="18" fill="#ffffff" stroke="#e6e9f2" stroke-width="1.5"/><text x="24" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#4f46e5" text-anchor="start">EU AI Act key dates</text><line x1="215" y1="84" x2="215" y2="454" stroke="#c7cdf5" stroke-width="3"/><circle cx="215" cy="84" r="10" fill="#4f46e5"/><text x="192" y="91" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#0b1220" text-anchor="end">1 Aug 2024</text><text x="240" y="91" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="500" fill="#374151" text-anchor="start">AI Act enters into force</text><circle cx="215" cy="158" r="10" fill="#4f46e5"/><text x="192" y="165" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#0b1220" text-anchor="end">2 Feb 2025</text><text x="240" y="165" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="500" fill="#374151" text-anchor="start">Banned practices apply</text><circle cx="215" cy="232" r="10" fill="#4f46e5"/><text x="192" y="239" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#0b1220" text-anchor="end">2 Aug 2025</text><text x="240" y="239" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="500" fill="#374151" text-anchor="start">General-purpose AI rules apply</text><circle cx="215" cy="306" r="10" fill="#4f46e5"/><text x="192" y="313" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#0b1220" text-anchor="end">2 Aug 2026</text><text x="240" y="313" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="500" fill="#374151" text-anchor="start">Transparency duties (Article 50)</text><circle cx="215" cy="380" r="10" fill="#f59e0b"/><text x="192" y="387" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#0b1220" text-anchor="end">2 Dec 2027</text><text x="240" y="387" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="500" fill="#374151" text-anchor="start">High-risk rules: Annex III systems</text><circle cx="215" cy="454" r="10" fill="#f59e0b"/><text x="192" y="461" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#0b1220" text-anchor="end">2 Aug 2028</text><text x="240" y="461" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="500" fill="#374151" text-anchor="start">High-risk rules: Annex I products</text></svg>