<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 584" width="640" height="584" role="img" aria-labelledby="t d"><title id="t">Conformity assessment routes</title><desc id="d">Two routes, internal control (Annex VI) or notified body (Annex VII), then declaration of conformity, CE marking and registration.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs><rect x="0.75" y="0.75" width="638.5" height="582.5" rx="18" fill="#ffffff" stroke="#e6e9f2" stroke-width="1.5"/><text x="24" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#4f46e5" text-anchor="start">Conformity assessment: routes and next steps</text><rect x="170" y="58" width="300" height="54" rx="12" fill="#eef0ff" stroke="#c7cdf5" stroke-width="1.5"/><text x="320" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#0b1220" text-anchor="middle">High-risk AI system</text><path d="M320 112 L169 150" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/><path d="M320 112 L471 150" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/><rect x="24" y="152" width="290" height="100" rx="14" fill="#f6f7fb" stroke="#e6e9f2" stroke-width="1.5"/><text x="169" y="182" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#0b1220" text-anchor="middle">Internal control</text><text x="169" y="206" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="600" fill="#0b1220" text-anchor="middle">(Annex VI)</text><text x="169" y="234" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="500" fill="#5b6578" text-anchor="middle">Provider self-assesses</text><rect x="326" y="152" width="290" height="100" rx="14" fill="#f6f7fb" stroke="#e6e9f2" stroke-width="1.5"/><text x="471" y="182" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#0b1220" text-anchor="middle">Notified body</text><text x="471" y="206" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="600" fill="#0b1220" text-anchor="middle">(Annex VII)</text><text x="471" y="234" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="500" fill="#5b6578" text-anchor="middle">Independent review</text><path d="M169 252 V272 H320 V298" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/><path d="M471 252 V272 H320" fill="none" stroke="#94a3b8" stroke-width="2"/><rect x="110" y="300" width="420" height="52" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/><text x="320" y="333" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#065f46" text-anchor="middle">EU declaration of conformity (Art. 47)</text><path d="M320 352 V372" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/><rect x="110" y="372" width="420" height="52" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/><text x="320" y="405" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#065f46" text-anchor="middle">CE marking (Art. 48)</text><path d="M320 424 V444" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/><rect x="110" y="444" width="420" height="52" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/><text x="320" y="477" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#065f46" text-anchor="middle">Registration in EU database (Art. 49)</text><rect x="60" y="518" width=