<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="t d"><title id="t">Four questions that decide which AI laws apply</title><desc id="d">Where your users are, what the AI does, your role, and what data is involved.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs><rect x="0.75" y="0.75" width="638.5" height="338.5" rx="18" fill="#ffffff" stroke="#e6e9f2" stroke-width="1.5"/><text x="24" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#4f46e5" text-anchor="start">Four questions to narrow it down</text><rect x="24" y="60" width="290" height="124" rx="14" fill="#f6f7fb" stroke="#e6e9f2" stroke-width="1.5"/><circle cx="58" cy="96" r="20" fill="#4f46e5"/><text x="58" y="103" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="90" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#0b1220" text-anchor="start">Where are your</text><text x="90" y="116" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#0b1220" text-anchor="start">users?</text><text x="48" y="158" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#5b6578" text-anchor="start">EU, UK, US states, Canada</text><rect x="326" y="60" width="290" height="124" rx="14" fill="#f6f7fb" stroke="#e6e9f2" stroke-width="1.5"/><circle cx="360" cy="96" r="20" fill="#4f46e5"/><text x="360" y="103" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="392" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#0b1220" text-anchor="start">What does the</text><text x="392" y="116" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#0b1220" text-anchor="start">AI do?</text><text x="350" y="158" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#5b6578" text-anchor="start">People decisions: more rules</text><rect x="24" y="196" width="290" height="124" rx="14" fill="#f6f7fb" stroke="#e6e9f2" stroke-width="1.5"/><circle cx="58" cy="232" r="20" fill="#4f46e5"/><text x="58" y="239" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="90" y="228" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#0b1220" text-anchor="start">What is your</text><text x="90" y="252" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#0b1220" text-anchor="start">role?</text><text x="48" y="294" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#5b6578" text-anchor="start">Provider or deployer</text><rect x="326" y="196" width="290" height="124" rx="14" fill="#f6f7fb" stroke="#e6e9f2" stroke-width="1.5"/><circle cx="360" cy="232" r="20" fill="#4f46e5"/><text x="360" y="239" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="392" y="228" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#0b1220" text-anchor="start">What data is</text><text x="392" y="252"