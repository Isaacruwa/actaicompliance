<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 590" width="640" height="590" role="img" aria-labelledby="t d"><title id="t">EU AI Act risk check</title><desc id="d">Six questions: AI system, prohibited use, Annex I product, Annex III area, Article 6(3) exception, transparency duties.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs><rect x="0.75" y="0.75" width="638.5" height="588.5" rx="18" fill="#ffffff" stroke="#e6e9f2" stroke-width="1.5"/><text x="24" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#4f46e5" text-anchor="start">EU AI Act risk check: six questions</text><rect x="24" y="56" width="592" height="78" rx="14" fill="#f6f7fb" stroke="#e6e9f2" stroke-width="1.5"/><circle cx="58" cy="95" r="18" fill="#4f46e5"/><text x="58" y="102" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="92" y="90" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#0b1220" text-anchor="start">Is it an AI system under the Act?</text><text x="92" y="115" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="600" fill="#64748b" text-anchor="start">No: the AI Act does not apply</text><rect x="24" y="144" width="592" height="78" rx="14" fill="#f6f7fb" stroke="#e6e9f2" stroke-width="1.5"/><circle cx="58" cy="183" r="18" fill="#4f46e5"/><text x="58" y="190" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="92" y="178" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#0b1220" text-anchor="start">Is the use prohibited (Article 5)?</text><text x="92" y="203" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="600" fill="#dc2626" text-anchor="start">Yes: banned</text><rect x="24" y="232" width="592" height="78" rx="14" fill="#f6f7fb" stroke="#e6e9f2" stroke-width="1.5"/><circle cx="58" cy="271" r="18" fill="#4f46e5"/><text x="58" y="278" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="92" y="266" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#0b1220" text-anchor="start">Part of a regulated product (Annex I)?</text><text x="92" y="291" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="600" fill="#d97706" text-anchor="start">Yes: high-risk from 2 Aug 2028</text><rect x="24" y="320" width="592" height="78" rx="14" fill="#f6f7fb" stroke="#e6e9f2" stroke-width="1.5"/><circle cx="58" cy="359" r="18" fill="#4f46e5"/><text x="58" y="366" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="92" y="354" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#0b1220" text-anchor="start">Used in an Annex III area?</text><text x="92" y="379" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="600" fill="#d97706" text-anchor="start">Yes: high-risk from 2 Dec 2027</text><rect x="24" y="408" width="592" height="78" rx="14" fill="#f6f7fb" stroke="#e6e9f2" stroke-width="1.5"/><circle cx="58" cy="447" r="18" fill="#4f46e5"/><text x="58" y="454" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="92" y="442" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#0b1220" text-anchor="start">Does the Article 6(3) exception apply?</text><text x="92" y="467" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="600" fill="#2563eb" text-anchor="start">Yes: not high-risk, but document and register</text><rect x="24" y="496" width="592" height="78" rx="14" fill="#f6f7fb" stroke="#e6e9f2" stroke-width="1.5"/><circle cx="58" cy="535" r="18" fill="#4f46e5"/><text x="58" y="542" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><text x="92" y="530" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#0b1220" text-anchor="start">Still check transparency (Article 50)</text><text x="92" y="555" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="600" fill="#059669" text-anchor="start">Tell people it is AI and label AI content</text></svg>